<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Dashboard Preview - Ashutosh Keshri</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 920px;
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header-tag {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      background: transparent !important;
    }
    .markdown-body table {
      display: table !important;
      width: 100% !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-tag">✨ GitHub Profile Dashboard Live Preview (@Ashutoshe4678)</div>
    <div id="content" class="markdown-body">Loading preview...</div>
  </div>

  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color:red;">Error loading README.md content.</p>';
      });
  </script>
</body>
</html>
